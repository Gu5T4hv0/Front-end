<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setembro Amarelo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="laco-amarelow">
        <img class="logo" src="assets/UNASP_LOGO.svg" alt="">
        <div class="yellow-block">
            <div class="mote">
                <img src="./assets/MOTE.svg" alt="">
            </div>
            <div class="text1">
                <h1 class="preciso">Olá! Precisa <br> de ajuda?</h1>
                <p class="info">Aqui você encontra informações confiáveis sobre saúde mental e lugares que oferecem apoio gratuito ou a custo social.</p>
            </div>
        </div>
        <div class="texture"></div>
        <div class="exclamation"></div>
    </div>

    <div class="bloco2">
        <div class="text2">
            <h1 class="salvar">Conhecer sobre saúde mental pode salvar vidas</h1>
            <p class="vita">Aprenda a reconhecer sinais em você e nos outros por meio dos materiais educativos do Vita Alere.</p>
        </div>
        <div class="access">
            <button>Acessar cartilhas e manuais</button>
        </div>
        
    </div>
</body>
</html>
