<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Units Demo</title>
  <style>
    html {
      font-size: 16px; /* base font size = 1rem */
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .example {
      background-color: #3498db;
      color: white;
      margin: 20px 0;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .em-box {
      font-size: 1em;
      width: 20em;
    }

    .rem-box {
      font-size: 1rem;
      width: 20rem;
    }

    .percent-box {
      width: 50%;
      font-size: 1rem;
    }

    .vw-box {
      width: 50vw;
      font-size: 2vw;
    }

    .vh-box {
      height: 30vh;
      font-size: 2vh;
    }
  </style>
</head>
<body>
  <h1>💡 Responsive Units Demo</h1>

  <div class="example em-box">em → width: 20em</div>
  <div class="example rem-box">rem → width: 20rem</div>
  <div class="example percent-box">% → width: 50%</div>
  <div class="example vw-box">vw → width: 50vw, font-size: 2vw</div>
  <div class="example vh-box">vh → height: 30vh, font-size: 2vh</div>

  <p>Try resizing the browser window and watch how each box changes.</p>
</body>
</html>
