<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Exemplo (responsivo)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    header {
      background-color: #3498db;
      color: white;
      text-align: center;
      padding: 1.5rem;
    }

    nav {
      background-color: #2980b9;
      padding: 1rem;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: #f2f2f2;
      flex: 1 1 300px;
      max-width: 350px;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    /* Media query: tela menor que 768px */
    @media (max-width: 768px) {
      nav a {
        display: block;
        margin: 0.5rem 0;
      }

      .card {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Meu Site Responsivo</h1>
  </header>

  <nav>
    <a href="#">Início</a>
    <a href="#">Serviços</a>
    <a href="#">Contato</a>
  </nav>

  <div class="container">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>

  <footer>
    <p>Todos os direitos reservados © 2025</p>
  </footer>
</body>
</html>
