<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Site Exemplo (sem responsividade)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    header {
      background-color: #3498db;
      color: white;
      text-align: center;
      padding: 20px;
    }

    nav {
      background-color: #2980b9;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: 1000px;
      margin: 20px auto;
      display: flex;
      gap: 20px;
    }

    .card {
      background: #f2f2f2;
      width: 300px;
      padding: 20px;
      border-radius: 8px;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Meu Site Fixo</h1>
  </header>

  <nav>
    <a href="#">Início</a>
    <a href="#">Serviços</a>
    <a href="#">Contato</a>
  </nav>

  <div class="container">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>

  <footer>
    <p>Todos os direitos reservados © 2025</p>
  </footer>
</body>
</html>
