<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>edunext — Identifique-se</title>
  <link rel="shortcut icon" href="assets/logo verde água.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --edu-dark:   #2d006b;
      --edu-teal:   #00feca;
      --white:      #ffffff;
      --radius:     12px;
      --bg:         #f4f4f6;
      --surface:    #ffffff;
      --border:     #e2e2ea;
      --text:       #1a1a2e;
      --muted:      #6b6b80;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 640px) {
      body { padding: 1rem 0.75rem 2rem; align-items: flex-start; }
    }

    .container { max-width: 460px; width: 100%; margin: 0 auto; }

    /* ── HERO / HEADER ── */
    .hero {
      background: var(--edu-dark);
      border-radius: var(--radius);
      padding: 2rem 2rem 1.75rem;
      margin-bottom: 1.5rem;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
    .logo-svg { height: 44px; width: auto; display: block; }
    .logo-text { color: var(--edu-teal); font-size: 44px; font-weight: 600; letter-spacing: -2px; line-height: 1; }
    .hero h1 { color: #fff; font-size: 22px; font-weight: 500; line-height: 1.35; margin-bottom: 0.5rem; }
    .hero p  { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.65; }

    /* ── FORM PANEL ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .panel-title {
      font-size: 11px; font-weight: 600;
      color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: 6px;
    }

    .field-row { margin-bottom: 1.25rem; }
    .field-row:last-of-type { margin-bottom: 1.5rem; }
    .field-label {
      display: block;
      font-size: 13px; font-weight: 500; color: var(--text);
      margin-bottom: 7px;
    }
    .field-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.875rem;
      font-size: 14px; color: var(--text);
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field-input::placeholder { color: #b3b3c2; }
    .field-input:focus {
      border-color: var(--edu-dark);
      background: var(--surface);
    }
    .field-input.error {
      border-color: #e05252;
    }
    .field-error {
      font-size: 11px; color: #e05252;
      margin-top: 5px;
      display: none;
    }
    .field-error.show { display: block; }

    /* ── CTA ── */
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      background: var(--edu-dark); color: #fff;
      font-size: 14px; font-weight: 700;
      border: none; border-radius: 8px;
      padding: 0.85rem;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary svg { flex-shrink: 0; }

    .seal {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      font-size: 11px; color: var(--muted);
      margin-top: 1rem;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="hero">
    <div class="logo">
      <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 281.54 281.54">
        <path fill="#00feca" d="M105.6,2.02C39.35,5.62,11.09,45.13,2.14,96.23c-3.47,19.78-1.96,80.31-.74,88.3,8.63,56.53,44.14,92.57,108.65,95.8,99.45,7.11,162.78-15.47,170.13-109.8.7-9.01.89-3.55,1.26-30.7l.05-.53C283.52,18.02,215.56-8.23,105.6,2.02M248.87,157.17H66.02c7.51,34.38,38.12,60.13,74.75,60.13,23.53,0,44.55-10.63,58.59-27.33h39.07c-18,35.67-54.97,60.13-97.65,60.13-60.38,0-109.33-48.95-109.33-109.33,0-5.57.42-11.05,1.22-16.4h182.86c-7.51-34.38-38.12-60.13-74.75-60.13-23.53,0-44.55,10.63-58.59,27.33h-39.07c18.01-35.67,54.97-60.13,97.65-60.13,60.38,0,109.33,48.95,109.33,109.33,0,5.58-.42,11.05-1.22,16.4"/>
      </svg>
      <span class="logo-text">edunext</span>
    </div>
    <h1>Antes de simular, conte um pouco sobre você.</h1>
    <p>Essas informações personalizam o relatório que você vai gerar ao final da simulação.</p>
  </div>

  <!-- FORM -->
  <div class="panel">
    <div class="panel-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      seus dados
    </div>

    <form id="login-form" novalidate>
      <div class="field-row">
        <label class="field-label" for="f-nome">Nome</label>
        <input type="text" class="field-input" id="f-nome" placeholder="Seu nome completo" autocomplete="name">
        <div class="field-error" id="e-nome">Informe seu nome.</div>
      </div>

      <div class="field-row">
        <label class="field-label" for="f-cargo">Cargo</label>
        <input type="text" class="field-input" id="f-cargo" placeholder="Ex: Diretor financeiro" autocomplete="organization-title">
        <div class="field-error" id="e-cargo">Informe seu cargo.</div>
      </div>

      <div class="field-row">
        <label class="field-label" for="f-ies">IES (Instituição de Ensino)</label>
        <input type="text" class="field-input" id="f-ies" placeholder="Nome da instituição" autocomplete="organization">
        <div class="field-error" id="e-ies">Informe o nome da instituição.</div>
      </div>

      <button type="submit" class="btn-primary">
        continuar
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="seal">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Dados salvos apenas no seu dispositivo
    </div>
  </div>
</div>

<script>
  // Pre-fill if user already has saved info
  (function () {
    try {
      const saved = JSON.parse(localStorage.getItem('edunext_user_info') || 'null');
      if (saved) {
        document.getElementById('f-nome').value  = saved.nome  || '';
        document.getElementById('f-cargo').value = saved.cargo || '';
        document.getElementById('f-ies').value   = saved.ies   || '';
      }
    } catch (e) {}
  })();

  document.getElementById('login-form').addEventListener('submit', function (ev) {
    ev.preventDefault();

    const nomeEl  = document.getElementById('f-nome');
    const cargoEl = document.getElementById('f-cargo');
    const iesEl   = document.getElementById('f-ies');

    const nome  = nomeEl.value.trim();
    const cargo = cargoEl.value.trim();
    const ies   = iesEl.value.trim();

    let valid = true;
    [[nomeEl, nome, 'e-nome'], [cargoEl, cargo, 'e-cargo'], [iesEl, ies, 'e-ies']].forEach(([el, val, errId]) => {
      const errEl = document.getElementById(errId);
      if (!val) {
        el.classList.add('error');
        errEl.classList.add('show');
        valid = false;
      } else {
        el.classList.remove('error');
        errEl.classList.remove('show');
      }
    });

    if (!valid) return;

    localStorage.setItem('edunext_user_info', JSON.stringify({ nome, cargo, ies }));
    window.location.href = 'edunext-simulador-roi.html';
  });

  // Clear error state as user types
  ['f-nome','f-cargo','f-ies'].forEach((id, i) => {
    const errIds = ['e-nome','e-cargo','e-ies'];
    document.getElementById(id).addEventListener('input', function () {
      this.classList.remove('error');
      document.getElementById(errIds[i]).classList.remove('show');
    });
  });
</script>
</body>
</html>
