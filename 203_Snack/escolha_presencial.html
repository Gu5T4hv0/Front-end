<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Confirmar Pedido – 203 Snack</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="assets/favicon.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="produtos.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #f5820a 0%, #e8660a 100%);
      padding: 8px 0px 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(232,102,10,0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img.logo {
      height: 65px;
      object-fit: contain;
    }

    .header-back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .header-back:active {
      background: rgba(255,255,255,0.2);
    }

    .header-back svg {
      width: 22px;
      height: 22px;
    }

    /* ── CONTENT ── */
    .page {
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-name {
      font-size: 18px;
      font-weight: 600;
      color: #222;
      text-align: center;
      margin-bottom: 16px;
    }

    .product-img-wrap {
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-price {
      font-size: 26px;
      font-weight: 800;
      color: #111;
      margin-bottom: 28px;
    }

    /* ── FORM ── */
    .form-group {
      width: 100%;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      color: #222;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #f5820a;
    }

    input::placeholder {
      color: #bbb;
    }

    /* ── TOAST ── */
    .toast {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 999px;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      display: block;
      animation: fadeInOut 2.5s ease forwards;
    }

    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" onclick="history.back(); return false;" class="header-back" aria-label="Voltar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <a href="index.html">
      <img
      class="logo"
      src="assets/logo.svg"
      alt="203 Snack"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';"
    />
    </a>
    <span class="logo-fallback" style="display:none; color:#fff; font-weight:800; font-size:22px; letter-spacing:1px;">203 Snack</span>
  </header>

  <main class="page">
    <h1 class="product-name"></h1>

    <div class="product-img-wrap">
      <img src="" alt=""/>
    </div>

    <p class="product-price"></p>

    <div class="form-group">
      <label for="nome">Digite seu nome:</label>
      <input type="text" id="nome" placeholder="Ex.: João" />
    </div>

    <a class="cta">
      Finalizar
    </a>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      const produto = produtos[id]; // busca no objeto

      // preenche o HTML
      document.querySelector('.product-name').textContent = produto.nome;
      document.querySelector('.product-price').textContent = produto.preco;
      document.querySelector('.product-img-wrap img').src = 'assets/' + produto.imagem;
      document.querySelector('.product-img-wrap img').alt = produto.nome;
      document.querySelector('.cta').textContent = 'Finalizar';

      // passa o id adiante para a próxima página
      document.querySelector('.cta').href = 'presencial.html?id=' + id;

  </script>

</body>
</html>
