<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Admin – 203 Snack</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="assets/favicon.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f2f2f2;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #f5820a 0%, #e8660a 100%);
      padding: 8px 0px 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(232,102,10,0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img.logo {
      height: 65px;
      object-fit: contain;
    }

    .header-back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .header-back:active { background: rgba(255,255,255,0.2); }
    .header-back svg { width: 22px; height: 22px; }

    /* ── TABS ── */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px 10px;
    }

    .tab {
      font-size: 14px;
      font-weight: 600;
      padding: 6px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      background: linear-gradient(135deg, #f5820a, #e8660a);
      color: #fff;
    }

    .tab.inactive {
      background: transparent;
      color: #f5820a;
      border: none;
    }

    /* ── LIST ── */
    .orders-list {
      padding: 6px 14px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      list-style: none;
    }

    /* ── CARD ── */
    .order-card {
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px 12px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .order-card.border-yellow { border-color: #f5c518; }
    .order-card.border-red    { border-color: #e53935; }
    .order-card.border-blue   { border-color: #1e88e5; }

    /* close btn */
    .btn-close {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }

    .btn-close:active { transform: scale(0.9); }
    .btn-close.yellow { background: #f5c518; }
    .btn-close.red    { background: #e53935; }
    .btn-close.blue   { background: #1e88e5; }

    .btn-close svg {
      width: 14px;
      height: 14px;
      stroke: #fff;
      stroke-width: 2.5;
    }

    /* card body */
    .card-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .card-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: #222;
    }

    .card-price {
      font-size: 13px;
      color: #888;
      margin-top: 1px;
    }

    .card-right {
      text-align: right;
      flex-shrink: 0;
    }

    .card-person {
      font-size: 13px;
      font-weight: 600;
      color: #222;
    }

    .card-room {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    /* footer row */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 10px;
    }

    .card-time {
      font-size: 11px;
      color: #bbb;
    }

    .card-status {
      font-size: 12px;
      font-weight: 600;
      text-align: right;
    }

    .card-status.green  { color: #2eb85c; }
    .card-status.orange { color: #f5820a; }
    .card-status.gray   { color: #aaa; }

    .card-status-sub {
      font-size: 11px;
      font-weight: 400;
      color: #aaa;
      text-align: right;
      margin-top: 2px;
    }

    #confirmar_pagamento {
      position: fixed;
      transform: scale(0.5);
      padding-left: 2px;
      padding-right: 2px;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" onclick="history.back(); return false;" class="header-back" aria-label="Voltar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <img class="logo" src="assets/logo.svg" alt="203 Snack"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';" />
    <span class="logo-fallback" style="display:none; color:#fff; font-weight:800; font-size:22px; letter-spacing:1px;">203 Snack</span>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab inactive" onclick="setTab('done', this)">done</button>
    <button class="tab active"   onclick="setTab('afazer', this)">a fazer</button>
  </div>

  <!-- A FAZER -->
  <ul class="orders-list" id="list-afazer">

    <li class="order-card border-yellow">
      <button class="btn-close yellow" onclick="concluirCard(this)">
        <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <div class="card-row">
        <img class="card-img" src="assets/doritos.svg" alt="Doritos" />
        <div class="card-info">
          <p class="card-name">Doritos</p>
          <p class="card-price">5,99 <span style="color:#222; font-weight:400;">3x</span></p>
        </div>
        <div class="card-right">
          <p class="card-person">Wesley</p>
          <p class="card-room">Quarto: 705</p>
        </div>
      </div>
      <div class="card-footer">
        <span class="card-time">20:34</span>
        <div>
          <p class="card-status green">pagamento feito</p>
          <p class="card-status-sub">esperando pedido</p>
        </div>
      </div>
    </li>

    <li class="order-card border-red">
      <button class="btn-close red" onclick="concluirCard(this)">
        <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <div class="card-row">
        <img class="card-img" src="assets/doritos.svg" alt="Doritos" />
        <div class="card-info">
          <p class="card-name">Doritos</p>
          <p class="card-price">5,99 <span style="color:#222; font-weight:400;">3x</span></p>
        </div>
        <div class="card-right">
          <p class="card-person">Wesley</p>
          <p class="card-room">Quarto: 705</p>
        </div>
      </div>
      <div class="card-footer">
        <span class="card-time">20:34</span>
        <div>
          <p class="card-status orange">esperando pedido</p>
        </div>
      </div>
    </li>

    <li class="order-card border-blue">
      <button class="btn-close blue" onclick="concluirCard(this)">
        <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <div class="card-row">
        <img class="card-img" src="assets/doritos.svg" alt="Doritos" />
        <div class="card-info">
          <p class="card-name">Doritos</p>
          <p class="card-price">5,99 <span style="color:#222; font-weight:400;">3x</span></p>
        </div>
        <div class="card-right">
          <p class="card-person">Wesley</p>
        </div>
      </div>
      <div class="card-footer">
        <span class="card-time">20:34</span>
        <div></div>
      </div>
    </li>

  </ul>

  <a class="cta" id="confirmar_pagamento">
      Confirmar<br>pagamento
    </a>

  <!-- DONE -->
  <ul class="orders-list" id="list-done" style="display:none;"></ul>

  <script>
    // Guarda os pedidos concluídos em memória
    const pedidosDone = [];

    function agora() {
      const d = new Date();
      return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function concluirCard(btn) {
      const card = btn.closest('.order-card');

      // Captura dados do card
      const nome    = card.querySelector('.card-name').textContent;
      const preco   = card.querySelector('.card-price').textContent;
      const img     = card.querySelector('.card-img').src;
      const person  = card.querySelector('.card-person').textContent;
      const roomEl  = card.querySelector('.card-room');
      const room    = roomEl ? roomEl.textContent : '';
      const time1   = card.querySelector('.card-time').textContent || agora();
      const time2   = agora();

      // Guarda no array
      pedidosDone.push({ nome, preco, img, person, room, time1, time2 });

      // Anima e remove do "a fazer"
      card.style.transition = 'opacity 0.2s, transform 0.2s';
      card.style.opacity = '0';
      card.style.transform = 'scale(0.95)';
      setTimeout(() => card.remove(), 200);
    }

    function setTab(tabName, btnEl) {
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        t.classList.add('inactive');
      });
      btnEl.classList.remove('inactive');
      btnEl.classList.add('active');

      if (tabName === 'done') {
        document.getElementById('list-afazer').style.display = 'none';
        renderDone();
        document.getElementById('list-done').style.display = 'flex';
      } else {
        document.getElementById('list-done').style.display = 'none';
        document.getElementById('list-afazer').style.display = 'flex';
      }
    }

    function renderDone() {
      const list = document.getElementById('list-done');
      list.innerHTML = '';

      if (pedidosDone.length === 0) {
        list.innerHTML = '<li style="text-align:center; color:#bbb; font-size:14px; padding:40px 0;">Nenhum pedido concluído ainda.</li>';
        return;
      }

      pedidosDone.forEach(p => {
        list.innerHTML += `
          <li class="order-card" style="border-color:#ddd;">
            <div class="card-row">
              <img class="card-img" src="${p.img}" alt="${p.nome}" />
              <div class="card-info">
                <p class="card-name">${p.nome}</p>
                <p class="card-price">${p.preco}</p>
              </div>
              <div class="card-right">
                <p class="card-person">${p.person}</p>
                ${p.room ? `<p class="card-room">${p.room}</p>` : ''}
              </div>
            </div>
            <div class="card-footer" style="flex-direction:column; align-items:flex-end; gap:2px;">
              <div style="display:flex; justify-content:space-between; width:100%;">
                <span class="card-time">${p.time1}</span>
                <p class="card-status green">pagamento feito</p>
              </div>
              <div style="display:flex; justify-content:space-between; width:100%;">
                <span class="card-time">${p.time2}</span>
                <p class="card-status green">produto entregue</p>
              </div>
            </div>
          </li>
        `;
      });
    }
  </script>

</body>
</html>
