<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Confirmar Pedido – 203 Snack</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="assets/favicon.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="produtos.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #f5820a 0%, #e8660a 100%);
      padding: 8px 0px 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(232,102,10,0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img.logo {
      height: 65px;
      object-fit: contain;
    }

    .header-back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .header-back:active {
      background: rgba(255,255,255,0.2);
    }

    .header-back svg {
      width: 22px;
      height: 22px;
    }

    /* ── CONTENT ── */
    .page {
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-name {
      font-size: 18px;
      font-weight: 600;
      color: #222;
      text-align: center;
      margin-bottom: 16px;
    }

    .product-img-wrap {
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-price {
      font-size: 26px;
      font-weight: 800;
      color: #111;
      margin-bottom: 28px;
    }

    /* ── FORM ── */
    .form-group {
      width: 100%;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      color: #222;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #f5820a;
    }

    input::placeholder {
      color: #bbb;
    }

    /* ── BUTTONS ── */
    .btn-primary {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #f5820a 0%, #e8660a 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      padding: 17px 16px;
      border-radius: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(232,102,10,0.38);
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 10px;
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(232,102,10,0.28);
    }

    .btn-secondary {
      display: block;
      width: 100%;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #f5820a;
      text-decoration: underline;
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── QUANTITY ── */
    .qty-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      width: 100%;
      margin-bottom: 16px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid #ddd;
      background: #fff;
      color: #555;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .qty-btn:active { background: #f0f0f0; }

    .qty-value {
      font-size: 16px;
      font-weight: 600;
      color: #222;
      min-width: 20px;
      text-align: center;
    }

    /* ── TOAST ── */
    .toast {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 999px;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      display: block;
      animation: fadeInOut 2.5s ease forwards;
    }

    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" onclick="history.back(); return false;" class="header-back" aria-label="Voltar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <a href="index.html">
      <img
      class="logo"
      src="assets/logo.svg"
      alt="203 Snack"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';"
    />
    </a>
    <span class="logo-fallback" style="display:none; color:#fff; font-weight:800; font-size:22px; letter-spacing:1px;">203 Snack</span>
  </header>

  <main class="page">
    <h1 class="product-name"></h1>

    <div class="product-img-wrap">
      <img src="" alt=""/>
    </div>

    <p class="product-price"></p>

    <div class="form-group">
      <label for="quarto">Digite o número do seu quarto:</label>
      <input type="number" id="quarto" placeholder="Ex.: 203" />
    </div>

    <div class="form-group">
      <label for="nome">Digite seu nome:</label>
      <input type="text" id="nome" placeholder="Ex.: João" />
    </div>

    <div class="qty-wrap">
      <button class="qty-btn" onclick="alterarQty(-1)">−</button>
      <span class="qty-value" id="qty">1</span>
      <button class="qty-btn" onclick="alterarQty(1)">+</button>
    </div>

    <button class="btn-primary" onclick="pagar()">Pagar e Finalizar</button>

    <a class="btn-secondary" href="carrinho.html">
      Prefiro pagar ao receber o produto
    </a>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const produto = produtos[id];

    document.querySelector('.product-name').textContent = produto.nome;
    document.querySelector('.product-price').textContent = produto.preco;
    document.querySelector('.product-img-wrap img').src = 'assets/' + produto.imagem;
    document.querySelector('.product-img-wrap img').alt = produto.nome;

    function alterarQty(delta) {
      const el = document.getElementById('qty');
      const atual = parseInt(el.textContent);
      const novo = Math.max(1, atual + delta);
      el.textContent = novo;
      atualizarLinks();
    }

    function atualizarLinks() {
      const qty = document.getElementById('qty').textContent;
      document.querySelector('.btn-secondary').href = `carrinho.html?id=${id}&qty=${qty}`;
    }

    // inicializa os links com qty=1
    atualizarLinks();

    async function pagar() {
    const quarto = document.getElementById('quarto').value;
    const nome = document.getElementById('nome').value;
    const qty = document.getElementById('qty').textContent;

    const resposta = await fetch('/criar-pagamento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, qty, nome, quarto })
    });

    const dados = await resposta.json();
    window.location.href = dados.link;
  }
  </script>

</body>
</html>
