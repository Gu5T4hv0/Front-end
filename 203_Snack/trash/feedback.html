<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Feedback – 203 Snack</title>
  <link rel="shortcut icon" href="assets/favicon.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #f5820a 0%, #e8660a 100%);
      padding: 8px 0px 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(232,102,10,0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img.logo {
      height: 65px;
      object-fit: contain;
    }

    .header-back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .header-back:active {
      background: rgba(255,255,255,0.2);
    }

    .header-back svg {
      width: 22px;
      height: 22px;
    }

    /* ── CONTENT ── */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 20px 40px;
      gap: 10px;
    }

    label {
      font-size: 15px;
      font-weight: 500;
      color: #222;
    }

    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: #222;
      outline: none;
      resize: none;
      height: 52px;
      transition: border-color 0.15s, height 0.15s;
      overflow: hidden;
    }

    textarea:focus {
      border-color: #f5820a;
    }

    textarea::placeholder {
      color: #bbb;
    }

    /* ── BUTTON ── */
    .btn-send {
      width: 100%;
      background: linear-gradient(135deg, #f5820a 0%, #e8660a 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(232,102,10,0.38);
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 4px;
    }

    .btn-send:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(232,102,10,0.28);
    }

    /* ── TOAST ── */
    .toast {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 999px;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      display: block;
      animation: fadeInOut 2.5s ease forwards;
    }

    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" onclick="history.back(); return false;" class="header-back" aria-label="Voltar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <a href="index.html">
      <img
      class="logo"
      src="assets/logo.svg"
      alt="203 Snack"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';"
    />
    </a>
    <span class="logo-fallback" style="display:none; color:#fff; font-weight:800; font-size:22px; letter-spacing:1px;">203 Snack</span>
  </header>

  <main class="page">
    <label for="feedback">Digite seu feedback:</label>
    <textarea
      id="feedback"
      placeholder="Ex.: Aumente o preço, está muito barato"
      oninput="autoResize(this)"
    ></textarea>
    <button class="btn-send" onclick="enviarFeedback()">Enviar</button>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    function autoResize(el) {
      el.style.height = '52px';
      el.style.height = el.scrollHeight + 'px';
    }

    function mostrarToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
    }

    async function enviarFeedback() {
      const texto = document.getElementById('feedback').value.trim();

      if (!texto) {
        mostrarToast('Escreva seu feedback antes de enviar!');
        return;
      }

      try {
        const resposta = await fetch('/salvar-feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ feedback: texto })
        });

        const resultado = await resposta.json();

        if (resultado.sucesso) {
          mostrarToast('Feedback enviado, obrigado!');
          document.getElementById('feedback').value = '';
          autoResize(document.getElementById('feedback'));
          setTimeout(() => history.back(), 2000);
        }
      } catch (erro) {
        mostrarToast('Erro ao enviar. Tente novamente.');
        console.error(erro);
      }
    }
  </script>

</body>
</html>
