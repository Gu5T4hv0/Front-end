<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Entrega – 203 Snack</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="assets/favicon.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #f5820a 0%, #e8660a 100%);
      padding: 8px 0px 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(232,102,10,0.35);
      z-index: 100;
      position: sticky; 
      top: 0;
    }

    header img.logo {
      height: 65px;
      object-fit: contain;
    }

    .header-back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .header-back:active {
      background: rgba(255,255,255,0.2);
    }

    .header-back svg {
      width: 22px;
      height: 22px;
    }

    /* ── CONTENT ── */
    .options-page {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: calc(100vh - 80px);
    }

    .form-group {
      width: 100%;
      margin-bottom: 16px;
    }

    .pixcode {
        width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      color: #222;
      outline: none;
      transition: border-color 0.15s;
      overflow: hidden;
    }

    .pixcode p{
        color: #bbb;
    }

    .reembolso {
        text-align: center;
        width: 200px;
        font-size: 14px;
    }

    #advice {
      display: flex;
      align-items: center;
    }

    #acesse {
      display: block;
      width: 100%;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #f5820a;
      -webkit-tap-highlight-color: transparent;
    }

    #advice-cart {
      transform: scale(0.7);
    }
  </style>
</head>
<body>

  <header>
    <a href="#" onclick="history.back(); return false;" class="header-back" aria-label="Voltar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <a href="index.html">
      <img
      class="logo"
      src="assets/logo.svg"
      alt="203 Snack"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';"
    />
    </a>
    <span class="logo-fallback" style="display:none; color:#fff; font-weight:800; font-size:22px; letter-spacing:1px;">203 Snack</span>
  </header>

  <main class="options-page">
    <div class="badge" style="margin-bottom: 15px;"><p>Pagamento via pix</p></div>

    <div class="form-group">
      <!-- <input type="number" id="quarto" placeholder="Ex.: 203" /> -->
      <div class="pixcode"><p>ndjfnjebnfjebnfjrbnvjrnfvjddddddddddjd...</p></div>
    </div>

    <a href="" class="cta">Copiar código</a>

    <p class="reembolso">Haverá reembolso caso o produto não for entregue</p>

    <div id="advice">
      <p id="acesse">Após o pagamento acesse &rarr;</p>
      <a href="carrinho.html" class="fab-cart" id="advice-cart">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
          <circle cx="176" cy="416" r="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/>
          <circle cx="400" cy="416" r="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/>
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M48 80h64l48 272h256"/>
          <path d="M160 288h249.44a8 8 0 007.85-6.43l28.8-144a8 8 0 00-7.85-9.57H128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/>
        </svg>
        <span class="fab-cart__label">Minhas Compras</span>
      </a>
    </div>
  </main>

</body>
</html>
