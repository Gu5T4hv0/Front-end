<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Doritos 20g – 203 Snack</title>
  <link rel="shortcut icon" href="assets/favicon.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="produtos.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #f5820a 0%, #e8660a 100%);
      padding: 8px 0px 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(232,102,10,0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img.logo {
      height: 65px;
      object-fit: contain;
    }

    .header-back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .header-back:active {
      background: rgba(255,255,255,0.2);
    }

    .header-back svg {
      width: 22px;
      height: 22px;
    }

    /* ── CONTENT ── */
    .product-page {
      padding: 28px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-name {
      font-size: 18px;
      font-weight: 600;
      color: #222;
      text-align: center;
      margin-bottom: 20px;
    }

    .product-img-wrap {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-price {
      font-size: 32px;
      font-weight: 800;
      color: #111;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="header-back" aria-label="Voltar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <a href="index.html">
      <img
      class="logo"
      src="assets/logo.svg"
      alt="203 Snack"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';"
    />
    </a>
    <span class="logo-fallback" style="display:none; color:#fff; font-weight:800; font-size:22px; letter-spacing:1px;">203 Snack</span>
  </header>

  <main class="product-page">
    <h1 class="product-name"></h1>

    <div class="product-img-wrap">
      <img src="" alt="" />
    </div>

    <p class="product-price"></p>

    <a href="" class="cta"></a>
  </main>

  <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        const produto = produtos[id]; // busca no objeto

        // preenche o HTML
        document.querySelector('.product-name').textContent = produto.nome;
        document.querySelector('.product-price').textContent = produto.preco;
        document.querySelector('.product-img-wrap img').src = 'assets/' + produto.imagem;
        document.querySelector('.product-img-wrap img').alt = produto.nome;
        document.querySelector('.cta').textContent = 'Comprar agora';

        // passa o id adiante para a próxima página
        document.querySelector('.cta').href = 'escolha.html?id=' + id;
    </script>
</body>
</html>
